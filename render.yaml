version: "1"

services:
  - type: web
    name: takemycompute-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    dockerCommand: "bash start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: takemycompute-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: takemycompute-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: takemycompute-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"

  - type: redis
    name: takemycompute-redis
    plan: free
    ipAllowList: []

databases:
  - name: takemycompute-db
    plan: free
    databaseName: compute_cloud
